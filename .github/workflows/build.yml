name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Dart package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Run package tests
        run: flutter test

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    needs: package-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build release APK
        working-directory: example
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: meanvc2-example-android-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-device:
    name: iOS device release IPA (unsigned)
    runs-on: macos-latest
    needs: package-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build iOS device app
        working-directory: example
        run: flutter build ios --release --no-codesign
      - name: Package unsigned device IPA
        working-directory: example
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload meanvc2-example-ios-unsigned.ipa
      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: meanvc2-example-ios-device-unsigned-ipa
          path: example/meanvc2-example-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS release app
    runs-on: macos-latest
    needs: package-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build macOS app
        working-directory: example
        run: flutter build macos --release
      - name: Package macOS app
        working-directory: example
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/meanvc2_onnx_example.app meanvc2-example-macos.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: meanvc2-example-macos
          path: example/meanvc2-example-macos.zip
          if-no-files-found: error
          retention-days: 14
